<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>SCHEDULE STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #1a1918;
    color: #e8e8e2;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  /* ── ブランド帯 ────────────────── */
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5em;
    color: rgba(232,154,74,0.7);
    font-weight: 500;
    text-transform: uppercase;
    margin-bottom: 36px;
    padding-left: 0.5em; /* letter-spacing の分の中央寄せ補正 */
  }

  /* ── CONCERT TITLE（master-date-main と同じ系統のクリーム & 細フォント）── */
  .concert-title {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 30px;
    font-weight: 300;
    color: #f0e0c8;
    line-height: 1.45;
    letter-spacing: 0.04em;
    margin: 0 0 12px;
    word-break: break-word;
  }
  .concert-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #5a5a54;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 56px;
  }

  /* ── ROLE ボタン（縦に2つ、極シンプル） ── */
  .role-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .role-btn {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid #2c2a27;
    border-radius: 6px;
    padding: 22px 0;
    color: #f0e0c8;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    text-transform: uppercase;
    transition: border-color 0.18s, background 0.18s, color 0.18s;
  }
  .role-btn:hover {
    border-color: rgba(232,154,74,0.55);
    background: rgba(232,154,74,0.04);
    color: #f5d4a8;
  }
  .role-btn:active { transform: scale(0.99); }
  .role-btn .role-hint {
    display: block;
    margin-top: 6px;
    font-size: 9px;
    color: #5a5a54;
    letter-spacing: 0.25em;
    font-weight: 400;
    text-transform: none;
  }

  /* ── フッター ── */
  .footer {
    margin-top: 60px;
    color: #3a3a37;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ── ARTIST パスワード入力モーダル ── */
  .pass-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,8,0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .pass-modal.show { display: flex; }
  .pass-modal-body {
    background: #14130f;
    border: 1px solid #2c2a27;
    border-radius: 10px;
    padding: 32px 28px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .pass-modal-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #d8d8d4;
    letter-spacing: 0.45em;
    font-weight: 500;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .pass-modal-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #2c2a27;
    color: #f0e0c8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    text-align: center;
    letter-spacing: 0.6em;
    padding: 12px 0;
    margin-bottom: 24px;
    font-weight: 300;
  }
  .pass-modal-input:focus { outline: none; border-bottom-color: rgba(232,154,74,0.65); }
  .pass-modal-row { display: flex; gap: 10px; }
  .pass-modal-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.3em;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #2c2a27;
    background: transparent;
    color: #76766f;
    text-transform: uppercase;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .pass-modal-btn:hover { border-color: #5a5a53; color: #d8d8d4; }
  .pass-modal-btn.primary {
    border-color: rgba(232,154,74,0.55);
    background: rgba(232,154,74,0.10);
    color: #f5d4a8;
  }
  .pass-modal-btn.primary:hover {
    border-color: #e89a4a;
    background: rgba(232,154,74,0.18);
    color: #ffd9a8;
  }
  .pass-modal-err {
    color: #d08888;
    font-size: 10px;
    letter-spacing: 0.15em;
    margin-top: 14px;
    min-height: 13px;
    font-weight: 400;
  }
</style>

<div class="wrap">
  <div class="brand">SCHEDULE STUDIO</div>
  <h1 class="concert-title" id="concert-title">CONCERT</h1>
  <div class="concert-sub" id="concert-sub">Tap your role to enter</div>

  <div class="role-list">
    <a class="role-btn" href="phone-staff.html">
      STAFF
      <span class="role-hint">パスワード不要</span>
    </a>
    <button type="button" class="role-btn" onclick="openArtistPass()">
      ARTIST
      <span class="role-hint">パスワードが必要です</span>
    </button>
  </div>

  <div class="footer">SCHEDULE STUDIO</div>
</div>

<!-- ARTIST パスワード入力モーダル -->
<div class="pass-modal" id="artist-pass-modal" onclick="if(event.target===this)closeArtistPass()">
  <div class="pass-modal-body">
    <div class="pass-modal-title">ARTIST PASSWORD</div>
    <input type="password" inputmode="numeric" maxlength="8" class="pass-modal-input" id="artist-pass-input" placeholder="••••" />
    <div class="pass-modal-row">
      <button type="button" class="pass-modal-btn" onclick="closeArtistPass()">Cancel</button>
      <button type="button" class="pass-modal-btn primary" onclick="checkArtistPass()">Enter</button>
    </div>
    <div class="pass-modal-err" id="artist-pass-err"></div>
  </div>
</div>

<script>
  /* R66b: アイコン撤去、フォント・余白をアプリ全体（pc-edit / phone-staff）と統一感あるトーンに */

  // CONCERT TITLE 動的取得
  (function loadConcertTitle(){
    try {
      var keys = [
        'schedule-studio:current-concert-title',
        'schedule-studio:concert-title',
        'schedule-studio:tour:title'
      ];
      for (var i = 0; i < keys.length; i++) {
        var v = localStorage.getItem(keys[i]);
        if (v && v.length > 0) {
          document.getElementById('concert-title').textContent = v;
          return;
        }
      }
      var m = location.search.match(/[?&]title=([^&]+)/);
      if (m) {
        document.getElementById('concert-title').textContent = decodeURIComponent(m[1]);
      }
    } catch(e) {}
  })();

  // R114: ARTIST パスワード判定 - concerts:v1 の active concert から取得
  function getArtistPassword(){
    try {
      var concerts = JSON.parse(localStorage.getItem('schedule-studio:concerts:v1')||'[]');
      var activeId = localStorage.getItem('schedule-studio:active-concert-id');
      var c = (activeId && concerts.find(function(x){return x.id===activeId;})) || concerts[0];
      if (c && c.passwords && c.passwords.artist) return c.passwords.artist;
    } catch(e) {}
    return '2222';
  }

  function openArtistPass(){
    document.getElementById('artist-pass-modal').classList.add('show');
    document.getElementById('artist-pass-input').value = '';
    document.getElementById('artist-pass-err').textContent = '';
    setTimeout(function(){ document.getElementById('artist-pass-input').focus(); }, 50);
  }
  function closeArtistPass(){
    document.getElementById('artist-pass-modal').classList.remove('show');
  }
  function checkArtistPass(){
    var v = document.getElementById('artist-pass-input').value;
    var ok = getArtistPassword();
    if (v === ok) {
      /* R114: ?authed=1 URL バイパスを撤廃。sessionStorage 経由で安全に渡す */
      sessionStorage.setItem('schedule-studio:artist-authed-via-index', '1');
      location.href = 'phone-artist.html';
    } else {
      document.getElementById('artist-pass-err').textContent = 'パスワードが違います';
      document.getElementById('artist-pass-input').value = '';
      document.getElementById('artist-pass-input').focus();
    }
  }
  document.getElementById('artist-pass-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); checkArtistPass(); }
  });
</script>

</body>
</html>
