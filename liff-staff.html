<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="build-version" content="20260527.415100">
<title>SCHEDULE STUDIO — STAFF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fafaf8;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 22px 40px;
    letter-spacing: 0.01em;
  }
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #f5c878;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #fafaf8;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .panel {
    background: #131211;
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 22px 22px 20px;
    margin-bottom: 16px;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: #666;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .value {
    font-size: 16px;
    font-weight: 600;
    color: #fafaf8;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .value:last-child { margin-bottom: 0; }
  .name {
    font-size: 24px;
    font-weight: 700;
    color: #fafaf8;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin-bottom: 14px;
    border: 0.5px solid rgba(255,255,255,0.1);
  }
  .accent-green { color: #a8e878; }
  .accent-amber { color: #f5c878; }
  .id-mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #666;
    word-break: break-all;
    line-height: 1.5;
  }
  hr {
    border: none;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    margin: 18px 0;
  }
  .status-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 0.04em;
    line-height: 1.6;
  }
  .error {
    color: #e07a5f;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #444;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .phase-note {
    background: rgba(245,200,120,0.06);
    border-left: 2px solid rgba(245,200,120,0.4);
    padding: 12px 14px;
    font-size: 11.5px;
    color: #a8a8a0;
    line-height: 1.7;
    margin-top: 6px;
    border-radius: 0 4px 4px 0;
  }
  .phase-note strong { color: #f5c878; font-weight: 600; }
</style>
</head>
<body>

<div class="brand">SCHEDULE STUDIO ／ STAFF</div>
<div class="brand-sub">あなた専用ダッシュボード</div>

<div id="root" class="panel">
  <div class="label">Status</div>
  <div class="value status-line" id="status-text">LIFF 初期化中…</div>
</div>

<div class="footer">SCHEDULE STUDIO · v.415 · LIFF PHASE 1</div>

<script>
  // R415 Phase 1: LIFF プロトタイプ — プロフィール表示のみ
  // のむさんが LINE Developers Console で作成した LIFF ID をここに埋め込む
  const LIFF_ID = '2010208406-s7urLLR0';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML =
      '<div class="label">Error</div>' +
      '<div class="value error">' + esc(msg) + '</div>' +
      '<div class="status-line" style="margin-top:14px;">LIFF ID: <code class="id-mono">' + esc(LIFF_ID) + '</code></div>';
  }

  function renderProfile(profile, concertTitle) {
    const root = document.getElementById('root');
    const avatarHtml = profile.pictureUrl
      ? '<img src="' + esc(profile.pictureUrl) + '" class="avatar" alt="">'
      : '';
    root.innerHTML =
      avatarHtml +
      '<div class="label">Hi</div>' +
      '<div class="name">' + esc(profile.displayName) + '</div>' +
      (profile.statusMessage ? '<div class="status-line" style="margin-bottom:6px;">' + esc(profile.statusMessage) + '</div>' : '') +
      '<hr>' +
      '<div class="label">Concert</div>' +
      '<div class="value accent-amber">' + esc(concertTitle) + '</div>' +
      '<div class="label">Your LINE ID</div>' +
      '<div class="id-mono" style="margin-bottom:4px;">' + esc(profile.userId) + '</div>' +
      '<hr>' +
      '<div class="phase-note">' +
      '<strong>Phase 1: プロトタイプ</strong><br>' +
      '次のステップで、ここに自分の <strong>入り時間 / タイムテーブル / 部屋番号</strong> が表示される予定です。' +
      '</div>';
  }

  async function main() {
    if (LIFF_ID === '___LIFF_ID_PLACEHOLDER___') {
      renderError('LIFF ID が未設定です。LINE Developers Console で LIFF アプリを作成してください。');
      return;
    }
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const profile = await liff.getProfile();
      // Phase 1: アクティブ公演はクエリパラメータ or 固定値。
      // Phase 2 で Firebase 経由で SCHEDULE STUDIO 側のアクティブ公演と同期する予定。
      const params = new URLSearchParams(window.location.search);
      const concertTitle = params.get('concert') || '(未指定 — Phase 2 で自動同期)';
      renderProfile(profile, concertTitle);
    } catch (err) {
      renderError('LIFF init 失敗: ' + (err && err.message ? err.message : String(err)));
    }
  }

  main();
</script>

</body>
</html>
