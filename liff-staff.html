<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="build-version" content="20260530.429000">
<title>SCHEDULE STUDIO — STAFF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fafaf8;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 22px 40px;
    letter-spacing: 0.01em;
  }
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #f5c878;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #fafaf8;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .panel {
    background: #131211;
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 22px 22px 20px;
    margin-bottom: 16px;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: #666;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .value {
    font-size: 16px;
    font-weight: 600;
    color: #fafaf8;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .value:last-child { margin-bottom: 0; }
  .name {
    font-size: 24px;
    font-weight: 700;
    color: #fafaf8;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin-bottom: 14px;
    border: 0.5px solid rgba(255,255,255,0.1);
  }
  .accent-green { color: #a8e878; }
  .accent-amber { color: #f5c878; }
  .id-mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #666;
    word-break: break-all;
    line-height: 1.5;
  }
  hr {
    border: none;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    margin: 18px 0;
  }
  .status-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 0.04em;
    line-height: 1.6;
  }
  .error { color: #e07a5f; }
  .footer {
    text-align: center;
    margin-top: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #444;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .phase-note {
    background: rgba(245,200,120,0.06);
    border-left: 2px solid rgba(245,200,120,0.4);
    padding: 12px 14px;
    font-size: 11.5px;
    color: #a8a8a0;
    line-height: 1.7;
    margin-top: 6px;
    border-radius: 0 4px 4px 0;
  }
  .phase-note strong { color: #f5c878; font-weight: 600; }
  /* Phase 2: スタッフ識別入力 */
  .form-row { margin-top: 14px; }
  input.text-input, select.text-input {
    width: 100%;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.18);
    color: #fafaf8;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 4px;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
  }
  input.text-input::placeholder { color: #555; }
  button.btn {
    margin-top: 10px;
    background: transparent;
    border: 0.5px solid rgba(245,200,120,0.5);
    color: #f5c878;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 10px 18px;
    border-radius: 3px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
  }
  button.btn-secondary {
    border-color: rgba(255,255,255,0.18);
    color: #888;
    margin-top: 6px;
  }
  /* タイムテーブル / 入り時間 行 */
  .row {
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid rgba(168,232,120,0.4);
    border-radius: 0 4px 4px 0;
    margin-bottom: 6px;
  }
  .row .time {
    font-family: 'JetBrains Mono', monospace;
    color: #a8e878;
    font-weight: 600;
    font-size: 18px;
    margin-right: 10px;
  }
  .row .who { color: #fafaf8; font-size: 14px; }
  .row .where { color: #888; font-size: 11px; margin-top: 3px; }
  .empty {
    font-size: 12px;
    color: #666;
    font-style: italic;
    padding: 4px 0;
  }
</style>
</head>
<body>

<div class="brand">SCHEDULE STUDIO ／ STAFF</div>
<div class="brand-sub">入り時間ボード</div>

<div id="root" class="panel">
  <div class="label">Status</div>
  <div class="value status-line" id="status-text">LIFF 初期化中…</div>
</div>

<div class="footer">SCHEDULE STUDIO · v.429 · 入り時間ボード</div>

<script>
  // R416 Phase 2: Firebase 経由でアクティブ公演取得 + スタッフ識別 + 自分の入り時間表示
  const LIFF_ID = '2010208406-s7urLLR0';
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB0g9NU2jHWLgHSpgxyvWjizdloLbkJ_aM",
    authDomain: "schedule-studio-2b14f.firebaseapp.com",
    databaseURL: "https://schedule-studio-2b14f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "schedule-studio-2b14f",
    storageBucket: "schedule-studio-2b14f.firebasestorage.app",
    messagingSenderId: "480145267674",
    appId: "1:480145267674:web:8d1a8e9b11d3ee69613ee3"
  };
  // LIFF 側 localStorage キー (LIFF 内 WebView 専用)
  const LK_SELF_NAME = 'liff-staff:self-name';
  // SCHEDULE STUDIO 側 localStorage キー (Firebase 経由で読む)
  const SS_CONCERTS = 'schedule-studio:concerts:v1';
  const SS_ACTIVE   = 'schedule-studio:active-concert-id';
  const SS_ARRIVALS = 'schedule-studio:arrivalSectionsByDate:v1';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  let __profile = null;   // LIFF profile (displayName, userId, pictureUrl)
  let __selfName = null;  // スタッフが自己申告した名前 (LIFF 側 localStorage に保存)
  let __concert = null;   // アクティブ公演の object
  let __arrivals = {};    // arrivalSectionsByDate

  function renderError(msg) {
    document.getElementById('root').innerHTML =
      '<div class="label">Error</div>' +
      '<div class="value error">' + esc(msg) + '</div>';
  }

  function renderStaffIdentify() {
    const root = document.getElementById('root');
    const avatarHtml = __profile.pictureUrl
      ? '<img src="' + esc(__profile.pictureUrl) + '" class="avatar" alt="">'
      : '';
    root.innerHTML =
      avatarHtml +
      '<div class="label">Hi</div>' +
      '<div class="name">' + esc(__profile.displayName) + '</div>' +
      '<hr>' +
      '<div class="label">Concert</div>' +
      '<div class="value accent-amber">' + esc(__concert ? __concert.title : '(取得失敗)') + '</div>' +
      '<hr>' +
      '<div class="label">あなたは誰？</div>' +
      '<div style="font-size:11.5px;color:#a8a8a0;line-height:1.6;margin-bottom:10px;">' +
        'のむさんが SCHEDULE STUDIO で登録した <strong style="color:#fafaf8;">スタッフ名 (フルネーム or 役職)</strong> を入力してください。' +
        '<br>例: 田中、舞台監督、PA、照明など。<br>一度設定すれば次回から自動で出ます。' +
      '</div>' +
      '<div class="form-row">' +
      '<input type="text" class="text-input" id="self-name-input" placeholder="例: 田中 / 舞台監督" autocomplete="off">' +
      '</div>' +
      '<button class="btn" id="self-name-save">この名前で続行</button>';

    document.getElementById('self-name-save').addEventListener('click', function(){
      const v = (document.getElementById('self-name-input').value || '').trim();
      if (!v) return;
      __selfName = v;
      try { localStorage.setItem(LK_SELF_NAME, v); } catch(_) {}
      renderDashboard();
    });
    // Enter キーでも送信
    document.getElementById('self-name-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('self-name-save').click();
    });
  }

  function findMyArrivals() {
    // arrivalSectionsByDate[dateKey] = { sections: [{name, time, ...}], ... } or 配列など。
    // データ構造が複数バージョンの可能性があるので、柔軟に再帰的に探す。
    const matches = [];
    const needle = String(__selfName || '').toLowerCase();
    if (!needle) return matches;

    function walk(node, dateKey) {
      if (!node) return;
      if (Array.isArray(node)) { node.forEach(function(x){ walk(x, dateKey); }); return; }
      if (typeof node !== 'object') return;
      // この node に name / time っぽいプロパティがあれば arrival 行候補
      const name = node.name || node.staff || node.person || node.who || '';
      const time = node.time || node.in || node.arrival || node.arrivalTime || '';
      const where = node.location || node.venue || node.place || '';
      if (name && String(name).toLowerCase().indexOf(needle) >= 0) {
        matches.push({ date: dateKey, name: name, time: time, where: where });
      }
      Object.keys(node).forEach(function(k){
        if (k === 'name' || k === 'time' || k === 'in' || k === 'arrival') return;
        walk(node[k], dateKey);
      });
    }
    Object.keys(__arrivals || {}).forEach(function(dateKey){
      walk(__arrivals[dateKey], dateKey);
    });
    // 日付昇順
    matches.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    return matches;
  }

  function renderDashboard() {
    const root = document.getElementById('root');
    const avatarHtml = (__profile && __profile.pictureUrl)
      ? '<img src="' + esc(__profile.pictureUrl) + '" class="avatar" alt="">'
      : '';

    // R428: 個人名照合(Phase2 個人ダッシュボード)は廃止。
    //   「自分の入り時間はいらない・各セクションの入り時間だけでよい」とのむさん判断。
    //   arrivalSectionsByDate[dateKey] = [{id, section, time}] を日付ごとに一覧表示。
    const dates = Object.keys(__arrivals || {}).sort();
    let arrivalsHtml = '';
    dates.forEach(function(dateKey){
      const raw = __arrivals[dateKey];
      const rows = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.sections) ? raw.sections : []);
      const valid = rows.filter(function(r){ return r && (r.section || r.name) && (r.time || r.in); });
      if (valid.length === 0) return;
      valid.sort(function(a,b){ return String(a.time||a.in||'99:99').localeCompare(String(b.time||b.in||'99:99')); });
      arrivalsHtml += '<div class="label" style="margin-top:12px;">' + esc(dateKey) + '</div>';
      valid.forEach(function(r){
        arrivalsHtml += '<div class="row">' +
          '<span class="time">' + esc(r.time || r.in || '--:--') + '</span>' +
          '<span class="who">' + esc(r.section || r.name || '') + '</span>' +
          '</div>';
      });
    });
    if (!arrivalsHtml) {
      arrivalsHtml = '<div class="empty">入り時間がまだ登録されていません。<br>SCHEDULE STUDIO で入力すると自動で表示されます。</div>';
    }

    root.innerHTML =
      avatarHtml +
      '<div class="label">Hi</div>' +
      '<div class="name">' + esc(__profile ? __profile.displayName : '') + '</div>' +
      '<hr>' +
      '<div class="label">Concert</div>' +
      '<div class="value accent-amber">' + esc(__concert ? __concert.title : '(取得失敗)') + '</div>' +
      '<hr>' +
      '<div class="label">入り時間（セクション別）</div>' +
      arrivalsHtml;
  }

  async function fetchSSData(db) {
    function read(key) {
      return db.ref('ls/' + key).once('value').then(function(snap){
        const data = snap.val();
        if (!data || data.v == null) return null;
        try { return JSON.parse(data.v); } catch(_) { return data.v; }
      });
    }
    const [concerts, activeId, arrivals] = await Promise.all([
      read(SS_CONCERTS).catch(function(){ return null; }),
      read(SS_ACTIVE).catch(function(){ return null; }),
      read(SS_ARRIVALS).catch(function(){ return null; }),
    ]);
    let active = null;
    if (Array.isArray(concerts)) {
      active = concerts.find(function(x){ return x && x.id === activeId; }) || concerts[0] || null;
    }
    __concert = active;
    __arrivals = arrivals || {};
  }

  /* R419: 掲示板モード — Firebase の board:v1 をリアルタイム購読して表示 */
  function renderBoardMode(db) {
    const root = document.getElementById('root');
    let concertTitle = '';

    function renderBoardUI(text, updatedAt) {
      const safeText = esc(text || '').replace(/\n/g, '<br>');
      const updateTime = updatedAt ? new Date(updatedAt).toLocaleTimeString('ja-JP') : '';
      root.innerHTML =
        '<div class="label">Information Board</div>' +
        '<div class="name" style="font-size:18px;">' + esc(concertTitle || '掲示板') + '</div>' +
        '<hr>' +
        (safeText
          ? '<div style="font-family:\'Noto Sans JP\',sans-serif;font-size:14px;line-height:1.85;color:#fafaf8;white-space:pre-wrap;padding:8px 4px;letter-spacing:0.02em;min-height:200px;">' + safeText + '</div>'
          : '<div style="padding:40px 8px;text-align:center;font-style:italic;color:#666;font-size:13px;line-height:1.6;">まだ何も書かれていません。<br>のむさんが書くと、ここに即座に表示されます。</div>'
        ) +
        '<hr>' +
        '<div class="status-line"><span style="color:#a8e878;">●</span>&nbsp;リアルタイム同期中' +
        (updateTime ? '<span style="margin-left:12px;color:#666;">更新 ' + esc(updateTime) + '</span>' : '') +
        '</div>';
    }

    /* 初回表示 (ローディング) */
    root.innerHTML = '<div class="label">Information Board</div><div class="value status-line" style="margin-top:6px;">読み込み中…</div>';

    /* 公演名を取得 (1 回だけ) */
    db.ref('ls/schedule-studio:concerts:v1').once('value').then(function(snap){
      const d = snap.val();
      if (!d || d.v == null) return null;
      try { return JSON.parse(d.v); } catch(_) { return null; }
    }).then(function(concerts){
      if (!Array.isArray(concerts)) return;
      return db.ref('ls/schedule-studio:active-concert-id').once('value').then(function(aSnap){
        const aD = aSnap.val();
        let aid = null;
        if (aD && aD.v != null) {
          try { aid = JSON.parse(aD.v); } catch(_) { aid = aD.v; }
        }
        const c = concerts.find(function(x){ return x && x.id === aid; }) || concerts[0];
        concertTitle = (c && c.title) ? (c.title + ' 掲示板') : '掲示板';
      });
    }).catch(function(){});

    /* 掲示板内容をリアルタイム購読 */
    db.ref('ls/schedule-studio:board:v1').on('value', function(snap){
      const d = snap.val();
      const text = d && d.v != null ? d.v : '';
      const updatedAt = d && d.t ? d.t : null;
      renderBoardUI(text, updatedAt);
    }, function(err){
      console.warn('[Board] subscribe failed:', err && err.message);
      renderBoardUI('(購読失敗)', null);
    });
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      __profile = await liff.getProfile();

      // Firebase 初期化 + 匿名認証
      firebase.initializeApp(FIREBASE_CONFIG);
      try {
        await firebase.auth().signInAnonymously();
      } catch (authErr) {
        console.warn('[Firebase Auth] failed:', authErr && authErr.message);
        // 認証失敗でもデータベース読みを試みる (ルール次第)
      }
      const db = firebase.database();

      /* R419: URL クエリ ?view=board なら掲示板モード */
      const params = new URLSearchParams(window.location.search);
      if (params.get('view') === 'board') {
        renderBoardMode(db);
        return;
      }

      // SCHEDULE STUDIO データ取得
      await fetchSSData(db);

      // R428: 個人名の自己申告は廃止。常にセクション別入り時間ダッシュボードを表示。
      renderDashboard();

    } catch (err) {
      renderError('LIFF init 失敗: ' + (err && err.message ? err.message : String(err)));
    }
  }

  main();
</script>

</body>
</html>
